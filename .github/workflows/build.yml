name: Build iOS (test, unsigned)

# Запускается вручную: Actions -> "Build iOS (test, unsigned)" -> Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # tgcalls в .gitmodules указан относительным путём (../tgcalls.git),
      # в форке его нет — берём из оригинального репозитория Telegram
      - name: Checkout submodules
        run: |
          git submodule init
          git config submodule.submodules/TgVoipWebrtc/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          git config submodule.submodules/rlottie/rlottie.url https://github.com/TelegramMessenger/rlottie.git
          git submodule update --recursive --depth 1 || git submodule update --recursive

      - name: Select Xcode
        run: |
          NEED=$(python3 -c "import json;print(json.load(open('versions.json'))['xcode'])")
          echo "versions.json wants Xcode $NEED"
          echo "Installed:"; ls /Applications | grep -i xcode || true
          if [ -d "/Applications/Xcode_$NEED.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_$NEED.app/Contents/Developer"
            echo "XCODE_OVERRIDE=" >> $GITHUB_ENV
          else
            LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
            echo "::warning::Xcode $NEED not found, using $LATEST"
            sudo xcode-select -s "$LATEST/Contents/Developer"
            echo "XCODE_OVERRIDE=--overrideXcodeVersion" >> $GITHUB_ENV
          fi
          xcodebuild -version

      - name: Create config with my API keys
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PY'
          import json, os
          c = json.load(open('build-system/appstore-configuration.json'))
          import re
          # Secrets pasted with spaces/quotes/newlines break the clang -D flags: keep only the real value.
          api_id = re.search(r'\d+', os.environ['API_ID']).group(0)
          api_hash = re.search(r'[0-9a-fA-F]{32}', os.environ['API_HASH']).group(0)
          c['api_id'] = api_id
          c['api_hash'] = api_hash
          json.dump(c, open('my-config.json', 'w'), indent=2)
          PY

      - name: Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/bazel-disk-cache
          key: bazel-${{ github.sha }}
          restore-keys: |
            bazel-

      - name: Build
        run: |
          set -x
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py $XCODE_OVERRIDE \
            --cacheDir="$HOME/bazel-disk-cache" \
            build \
            --configurationPath=my-config.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$((${{ github.run_number }} + $(cat build_number_offset) + 100000))"
          mkdir -p out
          IPA=$(find -L bazel-bin/Telegram -maxdepth 1 -name 'Telegram.ipa' | head -1)
          echo "ipa: $IPA"
          cp "$IPA" out/

      - uses: actions/upload-artifact@v4
        with:
          name: Telegram-unsigned-ipa
          path: out/*.ipa
          if-no-files-found: warn
